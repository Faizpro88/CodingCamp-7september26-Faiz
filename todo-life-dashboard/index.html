<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header with Greeting and Theme Toggle -->
        <header class="card header">
            <div class="greeting-section">
                <h1 id="greeting-text">Selamat Pagi, User!</h1>
                <div class="custom-name-input">
                    <label for="custom-name">Nama Anda:</label>
                    <input type="text" id="custom-name" placeholder="Masukkan nama">
                    <button id="save-name-btn">Simpan</button>
                </div>
            </div>
            <div class="time-section">
                <p id="current-date">Sabtu, 12 September 2026</p>
                <p id="current-time">00:00:00</p>
            </div>
            <button id="theme-toggle" aria-label="Ganti Tema">🌙</button>
        </header>

        <!-- Focus Timer Section -->
        <section class="card timer-section">
            <h2>Pomodoro Timer (25 Menit)</h2>
            <div class="timer-display">
                <span id="timer">25:00</span>
            </div>
            <div class="timer-controls">
                <button id="startBtn">Mulai</button>
                <button id="stopBtn">Berhenti</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="timer-status" id="timer-status">Berhenti</div>
            <div class="progress-container">
                <div class="progress-bar" id="timer-progress"></div>
            </div>
        </section>

        <!-- To-Do List Section -->
        <section class="card todo-section">
            <h2>Daftar Tugas</h2>
            <div class="todo-input">
                <input type="text" id="task-input" placeholder="Tambah tugas baru...">
                <button id="add-task-btn">Tambah</button>
            </div>
            <ul id="task-list" class="task-list"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="card quick-links-section">
            <h2>Tautan Cepat</h2>
            <div class="quick-links-input">
                <input type="text" id="link-name-input" placeholder="Nama tautan">
                <input type="url" id="link-url-input" placeholder="https://example.com">
                <button id="add-link-btn">Tambah</button>
            </div>
            <ul id="link-list" class="link-list"></ul>
        </section>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
